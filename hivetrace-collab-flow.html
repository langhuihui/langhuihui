<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiveTrace · 协作架构</title>
<style>
  :root{
    --panel:#15181b; --line:#262a2e; --ink:#e9e7e2; --dim:#8b8d8a;
    --ok:#6ee7a8; --opt:#e7c46e; --bad:#e7796e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(1200px 620px at 50% -10%,#171b1f 0%,#0d0f11 62%)}
  body{color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       min-height:100vh;padding:32px 18px 52px}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0}
  .stamp{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

  svg{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}

  /* 角色容器：圆形徽章 */
  .ava{fill:#1b1f22;stroke:#2e3338;stroke-width:1;transition:stroke .25s,fill .25s}
  .ava.me{stroke:#4a4f55}
  .ava.gate{stroke:var(--ok);stroke-opacity:.5}
  .ava.owner{stroke:#5c6168}

  .sym{stroke:#c9ccd1;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
  .sym.dim{stroke:#7d8288}
  .sym.ok{stroke:var(--ok)}
  .sym.opt{stroke:var(--opt)}
  .sym.me{stroke:#a9aeb4}

  /* 环境容器：物体本体，无外圈 */
  .esym{fill:#1a1e22;stroke:#6f747a;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;
        transition:stroke .25s,fill .25s}
  .esym .hi{fill:#20252a;stroke:none}

  .lbl{fill:var(--ink);font-size:12px;font-weight:500;text-anchor:middle;letter-spacing:.02em}
  .sub{fill:var(--dim);font-size:10px;text-anchor:middle;letter-spacing:.06em}
  .envt{fill:#6f7378;font-size:9.5px;text-anchor:middle;letter-spacing:.05em}

  .flow{fill:none;stroke:#7f858c;stroke-width:1.4;stroke-dasharray:5 7;animation:dash 2.6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .obsline{fill:none;stroke:#4a4f55;stroke-width:1.2;stroke-dasharray:2 5}
  .loop{fill:none;stroke:var(--opt);stroke-width:1.3;stroke-opacity:.75;
        stroke-dasharray:4 6;animation:dash 3.4s linear infinite}
  .envline{fill:none;stroke:#3a3f45;stroke-width:1;stroke-dasharray:1 4}

  .dot{fill:var(--ink);opacity:.9}
  .dot.g{fill:var(--ok)}
  .dot.y{fill:var(--opt)}
  .dot.w{fill:#a9aeb4}
  .dot.talk{fill:#9fc4d6}

  .ret{fill:none;stroke:#a9aeb4;stroke-width:1.3;stroke-opacity:.55}
  .back{fill:none;stroke:#e7796e;stroke-width:1.3;stroke-opacity:.5;stroke-dasharray:5 6;
        animation:dash 3.2s linear infinite}
  .backlbl{fill:#c07b72;font-size:9.5px;letter-spacing:.08em}
  .dot.r{fill:#e7796e}
  .dot.up{fill:#a9c9d6}
  .talk{fill:none;stroke:#9fc4d6;stroke-width:1.2;stroke-opacity:.6;
        stroke-dasharray:2 5;animation:dash 3.8s linear infinite}
  .talklbl{fill:#9fc4d6;fill-opacity:.8;font-size:9px;letter-spacing:.08em}
  .stag{fill:#7d8288;font-size:9px;letter-spacing:.08em}
  .retlbl{fill:#7d8288;font-size:9.5px;letter-spacing:.12em;text-anchor:middle}

  /* 群 · 共享上下文 底衬 */
  .ctxband{fill:#ffffff;fill-opacity:.012;stroke:#3a4046;stroke-opacity:.5;
           stroke-width:1;stroke-dasharray:7 9}
  .ctxt{fill:#5f6469;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
  .ctxsub{fill:#4d5257;font-size:9px;letter-spacing:.06em}

  .ring{animation:breathe 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}

  /* 观察锥形扫描：CSS 驱动，可被告警态暂停 */
  .sweep{transform-box:view-box;transform-origin:609px 223px;
         animation:sweepSwing 6s ease-in-out infinite}
  @keyframes sweepSwing{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
  .cone-normal{fill:url(#cone);transition:opacity .35s ease}
  .cone-alert{fill:url(#coneAlert);opacity:0;transition:opacity .35s ease}
  .sweep.alert{animation-play-state:paused}
  .sweep.alert .cone-normal{opacity:0}
  .sweep.alert .cone-alert{opacity:1}

  .lane{fill:#101214;stroke:#202428;stroke-width:1}
  .lane-t{fill:#5f6469;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase}
  .node-opt{fill:#191713;stroke:var(--opt);stroke-opacity:.5;stroke-width:1.2}

  .hit{cursor:pointer}
  .hit:hover .sym{stroke:#e9e7e2}
  .hit:hover .esym{stroke:#a9aeb4;fill:#1f2429}
  .hit.active .sym{stroke:var(--ok)}
  .hit.active .esym{stroke:var(--opt);fill:#221e15}
  .rbot{fill:#1a1e22;stroke:#b9bec4;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s,fill .25s}
  .rbot .panel{fill:#20252a;stroke:#b9bec4;stroke-width:1.2}
  .rbot .eye{fill:#cfd3d8;stroke:none}
  .rbot.dim{stroke:#7d8288}
  .rbot.dim .panel{stroke:#7d8288}
  .rbot.dim .eye{fill:#8b9096}
  .rbot.ok{stroke:var(--ok)}
  .rbot.ok .panel{stroke:var(--ok)}
  .rbot.ok .eye{fill:var(--ok)}
  .rbot.me{stroke:#a9aeb4}
  /* 角色配色 + 发光 */
  .c-sched{stroke:#e7c46e !important;filter:drop-shadow(0 0 5px rgba(231,196,110,.45))}
  .c-sched .eye{fill:#e7c46e}
  .c-obs{stroke:#7fd7e0 !important;filter:drop-shadow(0 0 5px rgba(127,215,224,.45))}
  .c-obs .eye{fill:#7fd7e0}
  .c-dev{stroke:#7aa2f7 !important;filter:drop-shadow(0 0 5px rgba(122,162,247,.42))}
  .c-dev .eye{fill:#7aa2f7}
  .c-verify{stroke:#6ee7a8 !important;filter:drop-shadow(0 0 6px rgba(110,231,168,.5))}
  .c-verify .eye{fill:#6ee7a8}
  .c-build{stroke:#c4a3f7 !important;filter:drop-shadow(0 0 5px rgba(196,163,247,.42))}
  .c-build .eye{fill:#c4a3f7}
  .c-pub{stroke:#e7a06e !important;filter:drop-shadow(0 0 5px rgba(231,160,110,.45))}
  .c-pub .eye{fill:#e7a06e}
  .tape{stroke-dasharray:4 4;animation:dash 1.1s linear infinite}
  .spark{animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}

  .legend{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-top:6px;
          font-size:11px;color:var(--dim);letter-spacing:.03em}
  .legend i{display:inline-block;width:26px;height:0;border-top:1.6px dashed #7f858c;
            vertical-align:middle;margin-right:7px;position:relative;top:-2px}
  .legend i.obs{border-top-style:dotted;border-top-color:#4a4f55}
  .legend i.opt{border-top-color:var(--opt)}
  .legend i.ret{border-top-style:solid;border-top-color:#a9aeb4;opacity:.75}
  .legend b{color:#cfd3d7;font-weight:500}

  .tray{margin-top:26px;border:1px solid var(--line);border-radius:14px;
        background:linear-gradient(180deg,#111417,#0e1114);padding:16px 18px 14px}
  .tray-h{font-size:10px;letter-spacing:.16em;color:#5f6469;text-transform:uppercase;margin-bottom:12px}
  .tray-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  @media(max-width:860px){.tray-g{grid-template-columns:repeat(4,1fr)}}
  .item{cursor:pointer;border:1px solid transparent;border-radius:10px;padding:10px 4px 8px;text-align:center;
        transition:background .2s,border-color .2s}
  .item:hover{background:#171b1f;border-color:#232830}
  .item.active{background:#191e22;border-color:var(--opt)}
  .item svg{width:34px;height:34px;display:block;margin:0 auto 8px}
  .item .n{font-size:10px;color:#9a9e9c;letter-spacing:.02em}
  .item:hover .n{color:var(--ink)}

  .maint{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .chip{font-size:11px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);
        border-radius:99px;padding:5px 13px;background:#121517;display:flex;align-items:center;gap:7px}
  .chip b{color:var(--ink);font-weight:600}
  .chip::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--ok);animation:ring 2.8s infinite}
  .chip.warn::before{background:var(--opt);animation-name:ringY}
  .chip.red::before{background:var(--bad);animation-name:ringR}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(110,231,168,.45)}70%{box-shadow:0 0 0 9px rgba(110,231,168,0)}100%{box-shadow:0 0 0 0 rgba(110,231,168,0)}}
  @keyframes ringY{0%{box-shadow:0 0 0 0 rgba(231,196,110,.45)}70%{box-shadow:0 0 0 9px rgba(231,196,110,0)}100%{box-shadow:0 0 0 0 rgba(231,196,110,0)}}
  @keyframes ringR{0%{box-shadow:0 0 0 0 rgba(231,121,110,.45)}70%{box-shadow:0 0 0 9px rgba(231,121,110,0)}100%{box-shadow:0 0 0 0 rgba(231,121,110,0)}}

  .hint{text-align:center;font-size:11px;color:#5f6469;margin-top:10px;letter-spacing:.04em}
  #sheet{position:fixed;top:0;right:0;height:100vh;width:min(430px,92vw);
    background:linear-gradient(180deg,#121619,#0e1114);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;padding:28px 26px 60px;z-index:20;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  #sheet.open{transform:translateX(0)}
  #sheet h2{font-size:17px;margin:0 0 4px}
  #sheet .role-tag{font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
  #sheet .sec{margin-top:20px}
  #sheet .sec h3{font-size:10.5px;color:var(--opt);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
  #sheet ul{margin:0;padding-left:0;list-style:none}
  #sheet li{position:relative;padding-left:16px;margin:5px 0;color:#cdd1d5;font-size:13px}
  #sheet li::before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;border-radius:99px;background:#4a4f55}
  #sheet .flowline{display:flex;flex-direction:column}
  #sheet .step{position:relative;padding:0 0 14px 22px;font-size:13px;color:#cdd1d5}
  #sheet .step::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:6px;border-radius:99px;background:var(--opt);opacity:.8}
  #sheet .step::after{content:"";position:absolute;left:5.5px;top:14px;bottom:0;width:1px;background:#2b3035}
  #sheet .step:last-child::after{display:none}
  #sheet .step:last-child{padding-bottom:0}
  #sheet .note{font-size:12px;color:var(--dim);border-left:2px solid #2b3035;padding-left:12px;margin-top:6px}
  #sheet .x{position:absolute;top:18px;right:20px;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
  #sheet .x:hover{color:var(--ink)}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
  #backdrop.on{opacity:1;pointer-events:auto}

  /* 需求整理 agent（接收房主需求，替调度卸掉拆解负担） */
  .c-intake{stroke:#e6a0c4 !important;filter:drop-shadow(0 0 5px rgba(230,160,196,.42))}
  .c-intake .eye{fill:#e6a0c4}

  /* 待办列表：需求整理建单 / 干活方推进状态 / 调度验后关单 */
  .todo-node{fill:#111518;stroke:#3a4046;stroke-width:1.2;transition:stroke .25s,fill .25s}
  .todo-node-h{fill:#9aa0a4;font-size:10.5px;letter-spacing:.1em}
  .todo-node-sep{stroke:#2b3035;stroke-width:1}
  .tl-dot.intake{fill:#e6a0c4}
  .tl-dot.dev{fill:#7aa2f7}
  .tl-dot.sched{fill:#e7c46e}
  .tl-name{fill:#c9ccd1;font-size:9.5px;letter-spacing:.02em}
  .tl-who{font-size:8.5px;text-anchor:end;letter-spacing:.03em}
  .tl-who.intake{fill:#e6a0c4;fill-opacity:.85}
  .tl-who.dev{fill:#7aa2f7;fill-opacity:.8}
  .tl-who.sched{fill:#e7c46e;fill-opacity:.85}
  .slink{fill:none;stroke:#4a5057;stroke-width:1;stroke-dasharray:2 4}
  .todoline{fill:none;stroke:#8f959b;stroke-width:1.2;stroke-dasharray:3 5;
            animation:dash 3s linear infinite}
  .devline{fill:none;stroke:#7aa2f7;stroke-opacity:.7;stroke-width:1.3;
           stroke-dasharray:5 4;animation:dash 2.4s linear infinite}
  .stag.dev{fill:#7aa2f7;fill-opacity:.9}
  .stag.intake{fill:#e6a0c4;fill-opacity:.95}
  .dot.devw{fill:#7aa2f7}
  .dot.intakew{fill:#e6a0c4}
  .intakeline{fill:none;stroke:#e6a0c4;stroke-opacity:.72;stroke-width:1.3;
              stroke-dasharray:5 4;animation:dash 2.6s linear infinite}
  .tgate{fill:#101815;stroke:var(--ok);stroke-opacity:.7;stroke-width:1.2}
  .tgate-t{fill:var(--ok);font-size:8.5px;text-anchor:middle;letter-spacing:.08em}
  .hub{fill:none;stroke:#8f959b;stroke-opacity:.22;stroke-dasharray:2 7}
  .hit:hover .todo-node{stroke:#8f959b;fill:#161b1f}
  .hit.active .todo-node{stroke:var(--opt);fill:#191d20}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>协作架构</h1>
    <div class="stamp">11-12 · 机器人 = 角色，物件 = 环境</div>
  </header>

  <svg viewBox="0 0 1000 790" role="img" aria-label="角色、环境、待办状态与自我优化回路">
    <defs>
      <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#e7c46e" opacity=".8"/>
      </marker>
      <marker id="arw2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#a9aeb4" opacity=".85"/>
      </marker>
      <marker id="arw4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#8f959b" opacity=".9"/>
      </marker>
      <marker id="arw3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#e7796e" opacity=".8"/>
      </marker>
      <marker id="arwDev" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#7aa2f7" opacity=".9"/>
      </marker>
      <marker id="arwIntake" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#e6a0c4" opacity=".9"/>
      </marker>
      <marker id="arwTalk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#9fc4d6" opacity=".9"/>
      </marker>

      <!-- 机器人 -->
      <symbol id="i-bot" viewBox="0 0 24 24">
        <path d="M12 4.2V2.6"/><circle cx="12" cy="2.1" r="1.1"/>
        <rect x="4.6" y="5.4" width="14.8" height="11.8" rx="3.6"/>
        <circle cx="9.1" cy="10.6" r="1.35"/><circle cx="14.9" cy="10.6" r="1.35"/>
        <path d="M9.4 14.3h5.2"/>
        <path d="M4.6 9.6H3.2v3.4h1.4M19.4 9.6h1.4v3.4h-1.4"/>
      </symbol>

      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M12 3.4v2.2M12 18.4v2.2M3.4 12h2.2M18.4 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6"/>
      </symbol>

      <!-- 物体：手机（机身+屏幕+听筒+Home） -->
      <symbol id="i-phone" viewBox="0 0 32 40">
        <rect x="4" y="2" width="24" height="36" rx="5"/>
        <rect class="hi" x="7" y="6.5" width="18" height="24" rx="2"/>
        <path d="M13 4.4h6"/><circle cx="16" cy="34" r="1.6"/>
      </symbol>

      <!-- 物体：双机 -->
      <symbol id="i-dual" viewBox="0 0 32 40">
        <rect x="2" y="6" width="15" height="28" rx="3.6"/>
        <rect class="hi" x="4.4" y="9.4" width="10.2" height="18" rx="1.6"/>
        <rect x="15" y="10" width="15" height="26" rx="3.6"/>
        <rect class="hi" x="17.4" y="13.2" width="10.2" height="16.4" rx="1.6"/>
      </symbol>

      <!-- 物体：分支板（三节点 + 连线，做成小铭牌） -->
      <symbol id="i-branch" viewBox="0 0 32 40">
        <rect x="3" y="4" width="26" height="32" rx="4"/>
        <circle cx="11" cy="13" r="2.6"/><circle cx="11" cy="27" r="2.6"/><circle cx="21" cy="20" r="2.6"/>
        <path d="M11 15.6v8.8M13.6 13h4.8a3.4 3.4 0 0 1 3.4 3.4v1"/>
      </symbol>

      <!-- 物体：文件夹 -->
      <symbol id="i-folder" viewBox="0 0 32 40">
        <path d="M3 10.4a2.4 2.4 0 0 1 2.4-2.4h6.2l2.8 3.2h12.2a2.4 2.4 0 0 1 2.4 2.4v15.2a2.4 2.4 0 0 1-2.4 2.4H5.4A2.4 2.4 0 0 1 3 28.8z"/>
        <path d="M3 14.6h26"/>
      </symbol>

      <!-- 物体：终端窗口 -->
      <symbol id="i-term" viewBox="0 0 32 40">
        <rect x="2" y="7" width="28" height="26" rx="3"/>
        <path d="M2 13.4h28"/>
        <circle cx="6.2" cy="10.2" r="1"/><circle cx="9.4" cy="10.2" r="1"/><circle cx="12.6" cy="10.2" r="1"/>
        <path d="M7.4 18.4l3.4 2.8-3.4 2.8"/><path d="M13.4 24h6.4"/>
      </symbol>

      <!-- 物体：磁盘 -->
      <symbol id="i-disk" viewBox="0 0 32 40">
        <rect x="3" y="13" width="26" height="14" rx="3"/>
        <path d="M3 17.4h26"/><circle cx="24" cy="22.6" r="1.5"/><path d="M7 22.6h10"/>
      </symbol>

      <!-- 物体：包裹 -->
      <symbol id="i-pack" viewBox="0 0 32 40">
        <path d="M16 4l11.4 6v20L16 36 4.6 30V10z"/>
        <path d="M4.6 10L16 16l11.4-6M16 16v20"/>
        <path d="M10.3 7.2L21.7 13.2"/>
      </symbol>

      <!-- 物体：信封 -->
      <symbol id="i-mail" viewBox="0 0 32 40">
        <rect x="3" y="11" width="26" height="18" rx="3"/>
        <path d="M4.2 12.6L16 21.6l11.8-9"/>
      </symbol>

      <!-- 物体：浏览器窗口 -->
      <symbol id="i-browser" viewBox="0 0 32 40">
        <rect x="2" y="8" width="28" height="24" rx="3"/>
        <path d="M2 15h28"/>
        <circle cx="6" cy="11.5" r="1"/><circle cx="9.4" cy="11.5" r="1"/><circle cx="12.8" cy="11.5" r="1"/>
        <path d="M6 19.4h20M6 23.4h14M6 27.4h17"/>
      </symbol>

      <!-- 物体：文档（折角纸） -->
      <symbol id="i-doc" viewBox="0 0 32 40">
        <path d="M7 4h12l7 7v25H7z"/>
        <path d="M19 4v7h7"/>
        <path d="M10.6 17h11.2M10.6 21.4h11.2M10.6 25.8h6.6"/>
      </symbol>

      <!-- 物体：卡片堆 -->
      <symbol id="i-cards" viewBox="0 0 32 40">
        <rect x="7" y="4" width="18" height="7" rx="2"/>
        <rect x="5.5" y="14" width="21" height="7" rx="2"/>
        <rect x="4" y="24" width="24" height="7" rx="2"/>
      </symbol>

      <!-- 物体：日志纸卷 -->
      <symbol id="i-log" viewBox="0 0 32 40">
        <rect x="6" y="4" width="20" height="30" rx="3"/>
        <path d="M10 11h12M10 16h12M10 21h8"/>
        <path d="M6 30h20"/>
      </symbol>

      <!-- 物体：剪贴板 -->
      <symbol id="i-clip" viewBox="0 0 32 40">
        <rect x="6" y="7" width="20" height="27" rx="3"/>
        <rect x="12" y="3.6" width="8" height="5.6" rx="1.8"/>

TRAY.forEach(([k,label,icon])=>{
  const d = document.createElement('div');
  d.className = 'item'; d.dataset.k = k;
  d.innerHTML = `<svg viewBox="0 0 32 40" fill="#1a1e22" stroke="#7d8288" stroke-width="1.3"
      stroke-linecap="round" stroke-linejoin="round"><use href="#t-${icon}"/></svg><div class="n">${label}</div>`;
  d.addEventListener('click', ()=>open(k,d));
  trayEl.appendChild(d);
});

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
let activeEl = null;

function open(key, el){
  const d = DATA[key]; if(!d) return;
  document.getElementById('s-title').textContent = d.name;
  document.getElementById('s-tag').textContent = d.tag;
  document.getElementById('s-body').innerHTML = `
    <div class="sec"><h3>职责</h3><ul>${d.duty.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="sec"><h3>执行流程</h3><div class="flowline">${d.flow.map(x=>`<div class="step">${x}</div>`).join('')}</div></div>
    <div class="sec"><h3>产出</h3><ul>${d.out.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="sec"><h3>边界 / 注意</h3><div class="note">${d.note}</div></div>`;
  sheet.classList.add('open'); backdrop.classList.add('on');
  if(activeEl) activeEl.classList.remove('active');
  activeEl = el; if(el) el.classList.add('active');
}
function close(){
  sheet.classList.remove('open'); backdrop.classList.remove('on');
  if(activeEl) activeEl.classList.remove('active'); activeEl = null;
}
document.querySelectorAll('.hit').forEach(el=>el.addEventListener('click', ()=>open(el.dataset.k, el)));
document.getElementById('close').addEventListener('click', close);
backdrop.addEventListener('click', close);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });

// 观察扫描：随机时刻模拟「发现问题」——变红、暂停转动、收窄张角，2s 后恢复
(function(){
  const sweep = document.getElementById('sweep');
  if(!sweep) return;
  function cycle(){
    const wait = 5000 + Math.random()*9000;
    setTimeout(()=>{
      sweep.classList.add('alert');
      setTimeout(()=>{
        sweep.classList.remove('alert');
        cycle();
      }, 2000);
    }, wait);
  }
  cycle();
})();
</script>
